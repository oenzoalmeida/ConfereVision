services:
  - type: web
    name: conferevision
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        value: administrador
      - key: ADMIN_EMAIL
        value: admin@conferevision.invalid
      - key: ADMIN_PASSWORD
        sync: false
